<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SEO Analytics Admin Panel</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .header {
      background: white;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 30px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header h1 {
      color: #333;
      font-size: 28px;
    }

    .logout-btn {
      background: #ff6b6b;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }

    .logout-btn:hover {
      background: #ff5252;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .stat-card h3 {
      color: #666;
      font-size: 14px;
      text-transform: uppercase;
      margin-bottom: 10px;
      letter-spacing: 1px;
    }

    .stat-card .value {
      color: #333;
      font-size: 32px;
      font-weight: bold;
    }

    .content-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 30px;
    }

    @media (max-width: 1024px) {
      .content-grid {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .card h2 {
      color: #333;
      margin-bottom: 15px;
      font-size: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    table th {
      background: #f5f5f5;
      padding: 10px;
      text-align: left;
      color: #666;
      font-weight: 600;
      border-bottom: 2px solid #e0e0e0;
    }

    table td {
      padding: 10px;
      border-bottom: 1px solid #eee;
    }

    table tr:hover {
      background: #f9f9f9;
    }

    .action-btn {
      padding: 6px 12px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      margin-right: 5px;
    }

    .promote-btn {
      background: #4CAF50;
      color: white;
    }

    .promote-btn:hover {
      background: #45a049;
    }

    .delete-btn {
      background: #ff6b6b;
      color: white;
    }

    .delete-btn:hover {
      background: #ff5252;
    }

    .settings-form {
      display: grid;
      gap: 15px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-group label {
      color: #333;
      margin-bottom: 5px;
      font-weight: 600;
    }

    .form-group input,
    .form-group textarea {
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-family: inherit;
      font-size: 14px;
    }

    .form-group textarea {
      resize: vertical;
      min-height: 100px;
    }

    .save-btn {
      background: #667eea;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      align-self: flex-start;
    }

    .save-btn:hover {
      background: #5568d3;
    }

    .alert {
      padding: 15px;
      border-radius: 6px;
      margin-bottom: 15px;
    }

    .alert-success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .alert-error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    .loading {
      text-align: center;
      color: #667eea;
      padding: 20px;
    }

    .empty-state {
      text-align: center;
      color: #999;
      padding: 40px 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="login-page" style="display: none;">
      <div class="card" style="max-width: 400px; margin: 50px auto;">
        <h2>Admin Login</h2>
        <div class="settings-form">
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="login-email" placeholder="admin@example.com">
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="login-password" placeholder="Your password">
          </div>
          <button class="save-btn" onclick="login()">Login</button>
        </div>
        <div id="login-message"></div>
      </div>
    </div>

    <div id="admin-page" style="display: none;">
      <div class="header">
        <h1>📊 Admin Dashboard</h1>
        <button class="logout-btn" onclick="logout()">Logout</button>
      </div>

      <div id="alert-container"></div>

      <div class="stats-grid">
        <div class="stat-card">
          <h3>Total Users</h3>
          <div class="value" id="total-users">-</div>
        </div>
        <div class="stat-card">
          <h3>Total Analyses</h3>
          <div class="value" id="total-analyses">-</div>
        </div>
        <div class="stat-card">
          <h3>Average Score</h3>
          <div class="value" id="avg-score">-</div>
        </div>
      </div>

      <div class="content-grid">
        <div class="card">
          <h2>👥 Users</h2>
          <div id="users-list" class="loading">Loading users...</div>
        </div>

        <div class="card">
          <h2>⚙️ Settings</h2>
          <div class="settings-form">
            <div class="form-group">
              <label>App Title</label>
              <input type="text" id="app-title" placeholder="SEO Analytics">
            </div>
            <div class="form-group">
              <label>CTA Text</label>
              <input type="text" id="cta-text" placeholder="We fix it for less than you think">
            </div>
            <div class="form-group">
              <label>CTA URL</label>
              <input type="text" id="cta-url" placeholder="https://your-website.com">
            </div>
            <button class="save-btn" onclick="saveSettings()">Save Settings</button>
          </div>
        </div>
      </div>

      <div class="card">
        <h2>📋 Top Analyzed Domains</h2>
        <div id="top-domains" class="loading">Loading...</div>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = 'https://analysis.seoh.ca/api';
    let token = localStorage.getItem('admin-token');

    function showAlert(message, type = 'success') {
      const container = document.getElementById('alert-container');
      const alert = document.createElement('div');
      alert.className = `alert alert-${type}`;
      alert.textContent = message;
      container.appendChild(alert);

      setTimeout(() => {
        alert.remove();
      }, 3000);
    }

    async function login() {
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;

      try {
        const response = await fetch(`${API_BASE}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();
        if (response.ok) {
          token = data.token;
          localStorage.setItem('admin-token', token);
          showPage('admin');
          loadDashboard();
        } else {
          showAlert(data.error || 'Login failed', 'error');
        }
      } catch (error) {
        showAlert('Login failed: ' + error.message, 'error');
      }
    }

    function logout() {
      localStorage.removeItem('admin-token');
      token = null;
      showPage('login');
    }

    function showPage(page) {
      document.getElementById('login-page').style.display = page === 'login' ? 'block' : 'none';
      document.getElementById('admin-page').style.display = page === 'admin' ? 'block' : 'none';
    }

    async function loadDashboard() {
      loadStats();
      loadUsers();
      loadSettings();
      loadTopDomains();
    }

    async function loadStats() {
      try {
        const response = await fetch(`${API_BASE}/admin/stats`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (response.ok) {
          const data = await response.json();
          document.getElementById('total-users').textContent = data.totalUsers;
          document.getElementById('total-analyses').textContent = data.totalAnalyses;
          document.getElementById('avg-score').textContent = data.avgScore.toFixed(1);
        }
      } catch (error) {
        console.error('Error loading stats:', error);
      }
    }

    async function loadUsers() {
      try {
        const response = await fetch(`${API_BASE}/admin/users`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (response.ok) {
          const data = await response.json();
          let html = '<table>';
          html += '<tr><th>Email</th><th>Role</th><th>Created</th><th>Actions</th></tr>';

          data.users.forEach(user => {
            const date = new Date(user.created_at).toLocaleDateString();
            html += `<tr>
              <td>${user.email}</td>
              <td>${user.role}</td>
              <td>${date}</td>
              <td>
                ${user.role !== 'admin' ? `<button class="action-btn promote-btn" onclick="promoteUser(${user.id})">Promote</button>` : ''}
                <button class="action-btn delete-btn" onclick="deleteUser(${user.id})">Delete</button>
              </td>
            </tr>`;
          });

          html += '</table>';
          document.getElementById('users-list').innerHTML = html;
        }
      } catch (error) {
        console.error('Error loading users:', error);
      }
    }

    async function promoteUser(userId) {
      if (!confirm('Promote this user to admin?')) return;

      try {
        const response = await fetch(`${API_BASE}/admin/users/${userId}/promote`, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (response.ok) {
          showAlert('User promoted to admin');
          loadUsers();
        } else {
          showAlert('Failed to promote user', 'error');
        }
      } catch (error) {
        showAlert('Error: ' + error.message, 'error');
      }
    }

    async function deleteUser(userId) {
      if (!confirm('Delete this user?')) return;

      try {
        const response = await fetch(`${API_BASE}/admin/users/${userId}`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (response.ok) {
          showAlert('User deleted');
          loadUsers();
        } else {
          showAlert('Failed to delete user', 'error');
        }
      } catch (error) {
        showAlert('Error: ' + error.message, 'error');
      }
    }

    async function loadSettings() {
      try {
        const response = await fetch(`${API_BASE}/admin/settings`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (response.ok) {
          const settings = await response.json();
          if (settings['app-title']) document.getElementById('app-title').value = settings['app-title'].setting_value;
          if (settings['cta-text']) document.getElementById('cta-text').value = settings['cta-text'].setting_value;
          if (settings['cta-url']) document.getElementById('cta-url').value = settings['cta-url'].setting_value;
        }
      } catch (error) {
        console.error('Error loading settings:', error);
      }
    }

    async function saveSettings() {
      const settings = {
        'app-title': document.getElementById('app-title').value,
        'cta-text': document.getElementById('cta-text').value,
        'cta-url': document.getElementById('cta-url').value,
      };

      try {
        for (const [key, value] of Object.entries(settings)) {
          await fetch(`${API_BASE}/admin/settings`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({ setting_key: key, setting_value: value })
          });
        }
        showAlert('Settings saved successfully');
      } catch (error) {
        showAlert('Error saving settings', 'error');
      }
    }

    async function loadTopDomains() {
      try {
        const response = await fetch(`${API_BASE}/admin/stats`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (response.ok) {
          const data = await response.json();
          let html = '<table>';
          html += '<tr><th>Domain</th><th>Analyses</th></tr>';

          data.topDomains.forEach(domain => {
            html += `<tr><td>${domain.url}</td><td>${domain.count}</td></tr>`;
          });

          html += '</table>';
          document.getElementById('top-domains').innerHTML = html;
        }
      } catch (error) {
        console.error('Error loading domains:', error);
      }
    }

    // Initialize
    window.addEventListener('load', () => {
      if (token) {
        showPage('admin');
        loadDashboard();
      } else {
        showPage('login');
      }
    });
  </script>
</body>
</html>
