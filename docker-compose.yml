version: '3.8'
services:
  backend:
    build: ./backend
    container_name: seo-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=postgres
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-seo_analytics}
      - JWT_SECRET=${JWT_SECRET}
      - GOOGLE_PAGESPEED_API_KEY=${GOOGLE_PAGESPEED_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GROK_API_KEY=${GROK_API_KEY:-}
      - BRAND_NAME=${BRAND_NAME:-SEO Analytics}
      - BRAND_LOGO_URL=${BRAND_LOGO_URL:-}
      - BRAND_PRIMARY_COLOR=${BRAND_PRIMARY_COLOR:-#14b8a6}
      - BRAND_CTA_TEXT=${BRAND_CTA_TEXT:-Contact Us}
      - BRAND_CTA_URL=${BRAND_CTA_URL:-}
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: seo-dashboard
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NEXT_PUBLIC_API_URL=${API_URL:-https://analysis.seoh.ca/api}

  postgres:
    image: postgres:16-alpine
    container_name: seo-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DB_NAME:-seo_analytics}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - seo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  seo_postgres_data:
